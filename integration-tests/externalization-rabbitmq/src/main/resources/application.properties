quarkus.modulith.docs.enabled=false
quarkus.modulith.events.messaging.default-channel=fallback
quarkus.modulith.events.messaging.ack-timeout=3s
quarkus.modulith.events.externalization.outbox.interval=1s
quarkus.modulith.events.externalization.outbox.send-timeout=10s

quarkus.rabbitmq.devservices.image-name=rabbitmq:4.3.7-management

mp.messaging.incoming.orders-in.exchange.name=orders
mp.messaging.incoming.orders-in.queue.name=received-orders
mp.messaging.incoming.orders-in.routing-keys=#
mp.messaging.incoming.shipments-in.exchange.name=shipments
mp.messaging.incoming.shipments-in.queue.name=received-shipments
mp.messaging.incoming.shipments-in.routing-keys=#
mp.messaging.incoming.eu-orders-in.exchange.name=eu-orders
mp.messaging.incoming.eu-orders-in.queue.name=received-eu-orders
mp.messaging.incoming.eu-orders-in.routing-keys=#
mp.messaging.incoming.fallback-in.exchange.name=fallback
mp.messaging.incoming.fallback-in.queue.name=received-fallback
mp.messaging.incoming.fallback-in.routing-keys=#
