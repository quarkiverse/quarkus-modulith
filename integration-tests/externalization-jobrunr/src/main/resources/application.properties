quarkus.modulith.docs.enabled=false
quarkus.modulith.events.externalization.mode=outbox
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18.7
quarkus.jobrunr.background-job-server.enabled=true
quarkus.jobrunr.background-job-server.poll-interval-in-seconds=5
quarkus.jobrunr.jobs.retry-back-off-time-seed=1
quarkus.jobrunr.dashboard.enabled=false
