quarkus.modulith.docs.enabled=false
quarkus.modulith.events.messaging.default-channel=fallback
quarkus.modulith.events.messaging.ack-timeout=3s
quarkus.modulith.events.externalization.outbox.interval=1s
quarkus.modulith.events.externalization.outbox.send-timeout=10s

quarkus.amqp.devservices.image-name=apache/activemq-artemis:2.44.0
quarkus.amqp.devservices.container-env.ARTEMIS_USER=admin
quarkus.amqp.devservices.container-env.ARTEMIS_PASSWORD=admin
# Never blocks producers on a nearly full disk of the build machine (the default max-disk-usage is 90%)
quarkus.amqp.devservices.container-env.EXTRA_ARGS=--http-host 0.0.0.0 --relax-jolokia --java-options=-Dbrokerconfig.maxDiskUsage=-1
# Reconnects within a second once the broker outage test resumes the paused broker
amqp-reconnect-interval=1

mp.messaging.incoming.orders-in.address=orders
mp.messaging.incoming.shipments-in.address=shipments
mp.messaging.incoming.eu-orders-in.address=eu-orders
