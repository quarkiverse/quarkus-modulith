quarkus.modulith.docs.enabled=false
quarkus.modulith.events.externalization.mode=outbox
quarkus.modulith.events.messaging.default-channel=fallback
quarkus.modulith.events.messaging.ack-timeout=10s
quarkus.modulith.events.externalization.outbox.interval=1s
quarkus.modulith.events.externalization.outbox.send-timeout=10s

quarkus.kafka.devservices.image-name=apache/kafka-native:4.2.0
quarkus.kafka.devservices.topic-partitions.orders=1
quarkus.kafka.devservices.topic-partitions.shipments=1
quarkus.kafka.devservices.topic-partitions.eu-orders=1

kafka.request.timeout.ms=1500
kafka.delivery.timeout.ms=3000
kafka.max.block.ms=2000
kafka.linger.ms=0

mp.messaging.incoming.received.topics=orders,shipments,eu-orders
mp.messaging.incoming.received.auto.offset.reset=earliest
mp.messaging.incoming.received.group.id=externalization-kafka-outbox
