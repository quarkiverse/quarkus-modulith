quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:observability;DB_CLOSE_DELAY=-1
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.otel.traces.sampler=always_on
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false
quarkus.otel.traces.exporter=none
quarkus.otel.exporter.otlp.enabled=false
quarkus.modulith.endpoint.enabled=true
quarkus.modulith.observability.metrics.publications.refresh-interval=PT0.2S
