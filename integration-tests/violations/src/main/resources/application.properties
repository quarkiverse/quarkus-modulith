# The billing module breaks the module rules on purpose. Report the violations instead of failing the build, so the
# application can be packaged and the tests can check what is reported. ViolatingModuleFailsBuildTest checks that the
# default mode fails the build.
quarkus.modulith.verification.mode=warn

# ViolationsAreReportedTest checks the model exported in Spring Modulith's JSON format.
quarkus.modulith.export.enabled=true
