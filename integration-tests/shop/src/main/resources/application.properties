quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18.7
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.modulith.events.republish-outstanding-events-on-restart=true
# The migration test reaches package-private Spring Modulith classes from its own package, so those jars load with the test classes
quarkus.class-loading.reloadable-artifacts=org.springframework.modulith:spring-modulith-events-jdbc,org.springframework.modulith:spring-modulith-events-jackson
