quarkus.modulith.docs.enabled=false
quarkus.modulith.moments.enable-time-machine=true
quarkus.modulith.moments.locale=en-US
# A native executable only has the data of these locales, GermanWeeksIT runs with de-DE
quarkus.locales=en-US,de-DE
quarkus.modulith.moments.quarter-start-month=october
# The tests move time with the time machine only, real scheduler ticks would add events
quarkus.scheduler.enabled=false
