name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "[0-9]+.[0-9]+.x"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'
  pull_request:
    branches:
      - "main"
      - "[0-9]+.[0-9]+.x"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MAVEN_ARGS: >-
    -B -ntp
    -Daether.connector.http.retryHandler.count=5
    -Daether.connector.http.retryHandler.interval=10000
    -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504
    ${{ github.event_name == 'pull_request' && format('-Dscalpel.baseBranch=origin/{0}', github.base_ref) || '-Dscalpel.enabled=false' }}

jobs:
  build:
    name: Build on JDK 21
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Restore the Maven repository
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-quarkus4-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-quarkus4-

      - name: Resolve the parent POMs and build extensions
        run: |
          for attempt in 1 2 3; do
            ./mvnw -q validate -Dno-format && exit 0
            echo "Resolution attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Build and test
        run: ./mvnw clean verify -Dno-format ${{ github.event_name == 'pull_request' && '-pl !coverage' || '' }}

      - name: Save the Maven repository
        if: success() && github.event_name != 'pull_request' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

      - name: Check that the generated configuration reference is committed
        run: |
          git add --intent-to-add docs/modules/ROOT/pages/includes
          git diff --exit-code docs/modules/ROOT/pages/includes

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-jdk21
          path: coverage/target/site/jacoco
          if-no-files-found: ignore

  native:
    name: Native integration tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space for the native builds and container images
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Restore the Maven repository
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-native-quarkus4-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-native-quarkus4-
            maven-quarkus4-

      - name: Resolve the parent POMs and build extensions
        run: |
          for attempt in 1 2 3; do
            ./mvnw -q validate -Dno-format && exit 0
            echo "Resolution attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Build and test the integration test applications as native executables
        run: ./mvnw verify -Dno-format -Dnative -Dquarkus.native.container-build=true -pl '!coverage'

      - name: Save the Maven repository
        if: success() && github.event_name != 'pull_request' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}
