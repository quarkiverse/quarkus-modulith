name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "*.x"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'
  pull_request:
    branches:
      - "main"
      - "*.x"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MAVEN_ARGS: >-
    -B -ntp
    -Daether.connector.http.retryHandler.count=5
    -Daether.connector.http.retryHandler.interval=10000
    -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504

jobs:
  build:
    name: Build on JDK ${{ matrix.java }} with ${{ matrix.quarkus.name }}
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
        quarkus:
          - name: Quarkus 3
            id: quarkus3
            profile: ""
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Restore the Maven repository
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ matrix.quarkus.id }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ matrix.quarkus.id }}-

      - name: Resolve the parent POMs and build extensions
        run: |
          for attempt in 1 2 3; do
            ./mvnw -q validate -Dno-format ${{ matrix.quarkus.profile }} && exit 0
            echo "Resolution attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Build, test and check coverage
        run: ./mvnw clean verify -Dno-format ${{ matrix.quarkus.profile }}

      - name: Save the Maven repository
        if: success() && matrix.java == 21 && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

      - name: Check that the generated configuration reference is committed
        run: |
          git add --intent-to-add docs/modules/ROOT/pages/includes
          git diff --exit-code docs/modules/ROOT/pages/includes

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-jdk${{ matrix.java }}-${{ matrix.quarkus.id }}
          path: coverage/target/site/jacoco
          if-no-files-found: ignore

  native:
    name: Native ${{ matrix.module }} with ${{ matrix.quarkus.name }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - shop
          - violations
          - events-jdbc
          - events-mongodb
          - events-neo4j
          - externalization-kafka
          - externalization-kafka-outbox
          - externalization-rabbitmq
          - externalization-amqp
          - externalization-jms
          - externalization-jobrunr
          - moments
          - observability
          - flyway
        quarkus:
          - name: Quarkus 3
            id: quarkus3
            profile: ""
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Restore the Maven repository
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ matrix.quarkus.id }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ matrix.quarkus.id }}-

      - name: Resolve the parent POMs and build extensions
        run: |
          for attempt in 1 2 3; do
            ./mvnw -q validate -Dno-format ${{ matrix.quarkus.profile }} -pl integration-tests/${{ matrix.module }} -am && exit 0
            echo "Resolution attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Build and test ${{ matrix.module }} as a native executable
        run: ./mvnw verify -Dno-format -Dnative -Dquarkus.native.container-build=true ${{ matrix.quarkus.profile }} -pl integration-tests/${{ matrix.module }} -am
